[build]
  ignore = """
    git diff --quiet "$CACHED_COMMIT_REF" "$COMMIT_REF" -- . \
      ':(exclude).claude' \
      ':(exclude)test' \
      ':(exclude).vscode' \
      ':(exclude)*.md' \
      ':(exclude).editorconfig' \
      ':(exclude).prettierrc.json' \
      ':(exclude).oxlintrc.json' \
      ':(exclude)eslint.config.ts' \
      ':(exclude)vitest.config.ts'
  """